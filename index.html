<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verkehrsstatistik (Öffentlich)</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  </head>

  <body class="stats-page">
    <!-- Filterleiste mit integriertem Titel -->
    <div class="stats-header-bar">
      <!-- 1. Titel -->
      <h1 class="stats-title">Verkehrsstatistik</h1>

      <!-- 2. Kompakte KPIs in der Mitte -->
      <div class="kpi-inline-group">
        <div class="kpi-inline-item">
          <span class="kpi-label">Messungen:</span>
          <strong id="totalCount" class="kpi-val">0</strong>
        </div>
        <div class="kpi-divider"></div>
        <div class="kpi-inline-item">
          <span class="kpi-label">Ø Tempo:</span>
          <strong id="avgSpeed" class="kpi-val">0 km/h</strong>
        </div>
        <div class="kpi-divider"></div>
        <div class="kpi-inline-item">
          <span class="kpi-label">Übertretungen (<span id="speedingDetail">≥ 55 km/h</span>):</span>
          <strong id="speedingCount" class="kpi-val kpi-alert">0</strong>
        </div>
      </div>

      <!-- 3. Filter rechts -->
      <div class="filter-controls">
        <div class="filter-group">
          <label for="filterPreset">Zeitraum</label>
          <select id="filterPreset" onchange="applyPreset()">
            <option value="yesterday">Gestern (Tag)</option>
            <option value="week">Diese Woche</option>
            <option value="month">Dieser Monat</option>
            <option value="year">Dieses Jahr</option>
            <option value="custom">Benutzerdefiniert</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterFrom">Datum Von</label>
          <input type="date" id="filterFrom" onchange="setCustomPreset()" />
        </div>
        <div class="filter-group">
          <label for="filterTo">Datum Bis</label>
          <input type="date" id="filterTo" onchange="setCustomPreset()" />
        </div>
        <button class="btn-filter" onclick="fetchAndRenderStats()">Filtern</button>
      </div>
    </div>

    <!-- Hauptbereich (Diagramme) -->
    <div class="charts">
      <!-- Tageszeit-Verteilung getrennt nach Richtungen -->
      <div class="chart-card hour-charts-card">
        <div class="card-header-row">
          <div>
            <h2>Tagesverlauf nach Fahrtrichtung</h2>
            <div class="chart-note">Anzahl Fahrzeuge pro Stunde</div>
          </div>
          <div class="legend">
            <span class="legend-speed-1">&lt;30 km/h</span>
            <span class="legend-speed-2">30-50 km/h</span>
            <span class="legend-speed-3">50-65 km/h</span>
            <span class="legend-speed-4">&gt;65 km/h</span>
          </div>
        </div>

        <div class="direction-chart-group">
          <div class="direction-subchart">
            <div class="subchart-title">Ankommend</div>
            <div class="hour-chart" id="hourChartAnkommend"></div>
          </div>
          <div class="direction-subchart">
            <div class="subchart-title">Gegenverkehr</div>
            <div class="hour-chart" id="hourChartGegenverkehr"></div>
          </div>
        </div>
      </div>

      <!-- Geschwindigkeitsklassen -->
      <div class="chart-card speed-bands-card">
        <h2>Geschwindigkeitsklassen</h2>
        <div class="chart-note">Aufschlüsselung nach Fahrtrichtung und Tempo</div>
        <div class="speed-bands" id="speedBands"></div>
      </div>
    </div>

    <script>
      function formatDateInput(d) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function applyPreset() {
        const preset = document.getElementById("filterPreset").value;
        const now = new Date();
        
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);

        let fromDate = new Date(yesterday);
        let toDate = new Date(yesterday);

        if (preset === "yesterday") {
          fromDate = yesterday;
        } else if (preset === "week") {
          const day = now.getDay() || 7;
          fromDate.setDate(now.getDate() - day + 1);
        } else if (preset === "month") {
          fromDate = new Date(now.getFullYear(), now.getMonth(), 1);
        } else if (preset === "year") {
          fromDate = new Date(now.getFullYear(), 0, 1);
        } else {
          return;
        }

        document.getElementById("filterFrom").value = formatDateInput(fromDate);
        document.getElementById("filterTo").value = formatDateInput(toDate);
        fetchAndRenderStats();
      }

      function setCustomPreset() {
        document.getElementById("filterPreset").value = "custom";
      }

      function extractSpeedBands(b) {
        if (!b) return { speed1: 0, speed2: 0, speed3: 0, speed4: 0 };
        if (Array.isArray(b)) {
          return {
            speed1: b[0] || 0,
            speed2: b[1] || 0,
            speed3: b[2] || 0,
            speed4: b[3] || 0,
          };
        }
        return {
          speed1: b.speed1 ?? b["<30"] ?? b["speed-1"] ?? b.s1 ?? 0,
          speed2: b.speed2 ?? b["30-50"] ?? b["speed-2"] ?? b.s2 ?? 0,
          speed3: b.speed3 ?? b["50-65"] ?? b["speed-3"] ?? b.s3 ?? 0,
          speed4: b.speed4 ?? b[">65"] ?? b[">70"] ?? b["speed-4"] ?? b.s4 ?? 0,
        };
      }

      function renderSingleHourChart(containerId, hourlyCounts, hourlySpeedBands) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = "";

        const maxCount = Math.max(...hourlyCounts, 1);

        hourlyCounts.forEach((count, hour) => {
          const col = document.createElement("div");
          col.className = "hour-column";

          const barHeightPercent = (count / maxCount) * 100;
          const bands = hourlySpeedBands[hour] || {
            speed1: 0,
            speed2: 0,
            speed3: 0,
            speed4: 0,
          };

          const totalBands = (bands.speed1 || 0) + (bands.speed2 || 0) + (bands.speed3 || 0) + (bands.speed4 || 0);
          const safeCount = totalBands > 0 ? totalBands : (count > 0 ? count : 1);

          const seg1 = Math.round(((bands.speed1 || 0) / safeCount) * 100);
          const seg2 = Math.round(((bands.speed2 || 0) / safeCount) * 100);
          const seg3 = Math.round(((bands.speed3 || 0) / safeCount) * 100);
          const seg4 = Math.round(((bands.speed4 || 0) / safeCount) * 100);

          let segmentsHtml = "";
          if (totalBands > 0) {
            if (bands.speed1 > 0) segmentsHtml += `<div class="bar-segment speed-1" style="height: ${seg1}%;" title="<30 km/h: ${bands.speed1}"></div>`;
            if (bands.speed2 > 0) segmentsHtml += `<div class="bar-segment speed-2" style="height: ${seg2}%;" title="30-50 km/h: ${bands.speed2}"></div>`;
            if (bands.speed3 > 0) segmentsHtml += `<div class="bar-segment speed-3" style="height: ${seg3}%;" title="50-65 km/h: ${bands.speed3}"></div>`;
            if (bands.speed4 > 0) segmentsHtml += `<div class="bar-segment speed-4" style="height: ${seg4}%;" title=">65 km/h: ${bands.speed4}"></div>`;
          } else if (count > 0) {
            segmentsHtml = `<div class="bar-segment speed-2" style="height: 100%;" title="Anzahl: ${count}"></div>`;
          }

          col.innerHTML = `
            <div class="hour-count-top">${count > 0 ? count : ""}</div>
            <div class="stacked-bar" style="height: ${count > 0 ? Math.max(barHeightPercent, 4) : 0}%;">
              ${segmentsHtml}
            </div>
            <div class="hour-label">${String(hour).padStart(2, "0")}</div>
          `;

          container.appendChild(col);
        });
      }

      function getSpeedBandColorClass(label) {
        if (label === "<30") return "speed-1";
        if (label === ">70") return "speed-4";
        const minVal = Number(label.split("-")[0]);
        if (isNaN(minVal)) return "speed-1";

        if (minVal < 50) return "speed-2";
        if (minVal < 65) return "speed-3";
        return "speed-4";
      }

      function renderSpeedBands(speedBands) {
        const container = document.getElementById("speedBands");
        container.innerHTML = "";

        Object.entries(speedBands).forEach(([direction, bands]) => {
          const dirTotal = Object.values(bands).reduce(
            (sum, count) => sum + count,
            0,
          );
          const safeDirTotal = dirTotal > 0 ? dirTotal : 1;
          const maxBandCount = Math.max(...Object.values(bands), 1);

          const dirSection = document.createElement("div");
          dirSection.className = "speed-dir-section";

          let html = `
            <div class="speed-dir-header">
              ${direction} (${dirTotal} Fahrzeuge)
            </div>
          `;

          Object.entries(bands).forEach(([label, count]) => {
            const percent = Math.round((count / safeDirTotal) * 100);
            const barWidthPercent = Math.round((count / maxBandCount) * 100);
            const colorClass = getSpeedBandColorClass(label);

            html += `
              <div class="speed-row">
                <span>${label} km/h</span>
                <div class="track">
                  <div class="fill ${colorClass}" style="width: ${barWidthPercent}%;"></div>
                </div>
                <strong>${count} (${percent}%)</strong>
              </div>
            `;
          });

          dirSection.innerHTML = html;
          container.appendChild(dirSection);
        });
      }

      function calculateSpeedingCount(speedBands, limit) {
        let count = 0;
        Object.values(speedBands).forEach(directionBands => {
          Object.entries(directionBands).forEach(([label, num]) => {
            let minVal = 0;
            if (label.startsWith(">")) {
              minVal = Number(label.substring(1));
            } else if (label.startsWith("<")) {
              minVal = 0;
            } else {
              minVal = Number(label.split("-")[0]);
            }
            if (!isNaN(minVal) && minVal >= limit) {
              count += num;
            }
          });
        });
        return count;
      }

      async function fetchAndRenderStats() {
        const fromStr = document.getElementById("filterFrom").value;
        const toStr = document.getElementById("filterTo").value;
        const limit = 55;

        document.getElementById("speedingDetail").innerText = `≥ ${limit} km/h`;

        if (!fromStr || !toStr) return;

        const fromDate = new Date(fromStr + "T00:00:00");
        const toDate = new Date(toStr + "T00:00:00");

        let totalCount = 0;
        let totalSpeedWeightedSum = 0;
        let rawSpeedingCount = 0;

        const hourlyAnkommend = Array(24).fill(0);
        const hourlyGegenverkehr = Array(24).fill(0);

        const bandsAnkommend = Array.from({ length: 24 }, () => ({ speed1: 0, speed2: 0, speed3: 0, speed4: 0 }));
        const bandsGegenverkehr = Array.from({ length: 24 }, () => ({ speed1: 0, speed2: 0, speed3: 0, speed4: 0 }));

        const aggregatedSpeedBands = {};

        const datesToFetch = [];
        for (let d = new Date(fromDate); d <= toDate; d.setDate(d.getDate() + 1)) {
          datesToFetch.push(formatDateInput(d));
        }

        const fetchPromises = datesToFetch.map(dateStr =>
          fetch(`data_stats/stats_${dateStr}.json`)
            .then(res => (res.ok ? res.json() : null))
            .catch(() => null)
        );

        const results = await Promise.all(fetchPromises);

        results.forEach(stats => {
          if (!stats) return;

          const count = stats.totalCount || 0;
          totalCount += count;
          if (stats.avgSpeed && count) {
            totalSpeedWeightedSum += stats.avgSpeed * count;
          }
          rawSpeedingCount += stats.speedingCount || 0;

          const ank = (stats.hourlyDirectionCounts && stats.hourlyDirectionCounts.Ankommend) || stats.hourlyCounts || [];
          const geg = (stats.hourlyDirectionCounts && stats.hourlyDirectionCounts.Gegenverkehr) || [];

          ank.forEach((val, h) => { hourlyAnkommend[h] += (val || 0); });
          geg.forEach((val, h) => { hourlyGegenverkehr[h] += (val || 0); });

          const ankBands = (stats.hourlyDirectionSpeedBands && stats.hourlyDirectionSpeedBands.Ankommend) || stats.hourlySpeedBands || [];
          const gegBands = (stats.hourlyDirectionSpeedBands && stats.hourlyDirectionSpeedBands.Gegenverkehr) || [];

          ankBands.forEach((b, h) => {
            const extracted = extractSpeedBands(b);
            bandsAnkommend[h].speed1 += extracted.speed1;
            bandsAnkommend[h].speed2 += extracted.speed2;
            bandsAnkommend[h].speed3 += extracted.speed3;
            bandsAnkommend[h].speed4 += extracted.speed4;
          });

          gegBands.forEach((b, h) => {
            const extracted = extractSpeedBands(b);
            bandsGegenverkehr[h].speed1 += extracted.speed1;
            bandsGegenverkehr[h].speed2 += extracted.speed2;
            bandsGegenverkehr[h].speed3 += extracted.speed3;
            bandsGegenverkehr[h].speed4 += extracted.speed4;
          });

          if (stats.speedBands) {
            Object.entries(stats.speedBands).forEach(([dir, bands]) => {
              if (!aggregatedSpeedBands[dir]) aggregatedSpeedBands[dir] = {};
              Object.entries(bands).forEach(([label, c]) => {
                aggregatedSpeedBands[dir][label] = (aggregatedSpeedBands[dir][label] || 0) + c;
              });
            });
          }
        });

        // Berechne Übertretungen dynamisch aus den aggregierten Geschwindigkeitsklassen
        const computedSpeeding = calculateSpeedingCount(aggregatedSpeedBands, limit);
        const finalSpeedingCount = computedSpeeding > 0 ? computedSpeeding : rawSpeedingCount;

        document.getElementById("totalCount").innerText = totalCount;
        const computedAvg = totalCount > 0 ? Math.round(totalSpeedWeightedSum / totalCount) : 0;
        document.getElementById("avgSpeed").innerText = `${computedAvg} km/h`;

        const speedingElem = document.getElementById("speedingCount");
        speedingElem.innerText = finalSpeedingCount;
        speedingElem.style.color = finalSpeedingCount > 0 ? "#ff4d4d" : "";

        renderSingleHourChart("hourChartAnkommend", hourlyAnkommend, bandsAnkommend);
        renderSingleHourChart("hourChartGegenverkehr", hourlyGegenverkehr, bandsGegenverkehr);

        renderSpeedBands(aggregatedSpeedBands);
      }

      applyPreset();
    </script>
  </body>
</html>
